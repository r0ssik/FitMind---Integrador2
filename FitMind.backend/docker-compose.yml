version: '3.8'

services:
  fitmind-api:
    image: fitmind-api
    build:
      context: .
      dockerfile: FitMind.BackEnd.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=fitmind-db;Database=fitmind;Username=fitmind_user;Password=fitmind_pass
    depends_on:
      fitmind-db:
        condition: service_healthy
    networks:
      - fitmind-network

  fitmind-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitmind
      POSTGRES_USER: fitmind_user
      POSTGRES_PASSWORD: fitmind_pass
    ports:
      - "5432:5432"
    volumes:
      - fitmind-pgdata:/var/lib/postgresql/data
    networks:
      - fitmind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmind_user -d fitmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitmind-pgdata:

networks:
  fitmind-network:
    driver: bridge
