version: '3.8'

services:

  # ── Frontend (Angular + Nginx) ─────────────────────────────────────────────
  fitmind-frontend:
    build:
      context: ../FitMind.frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      fitmind-api:
        condition: service_started
    networks:
      - fitmind-network

  # ── Backend (ASP.NET Core) ─────────────────────────────────────────────────
  fitmind-api:
    image: fitmind-api
    build:
      context: .
      dockerfile: FitMind.BackEnd.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=fitmind-db;Database=fitmind;Username=fitmind_user;Password=fitmind_pass
    depends_on:
      fitmind-db:
        condition: service_healthy
    networks:
      - fitmind-network

  # ── Banco de Dados (PostgreSQL) ────────────────────────────────────────────
  fitmind-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitmind
      POSTGRES_USER: fitmind_user
      POSTGRES_PASSWORD: fitmind_pass
    ports:
      - "5433:5432"
    volumes:
      - fitmind-pgdata:/var/lib/postgresql/data
    networks:
      - fitmind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmind_user -d fitmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitmind-pgdata:

networks:
  fitmind-network:
    driver: bridge
